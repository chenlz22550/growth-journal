    <span class="tape tape-a"></span><span class="tape tape-b"></span>
    <svg class="dd d1"><use href="#i-sun"/></svg>
    <svg class="dd d2"><use href="#i-cloud"/></svg>
    <svg class="dd d3"><use href="#i-rabbit"/></svg>
    <svg class="dd d4"><use href="#i-star"/></svg>
    <svg class="dd d5"><use href="#i-crayon"/></svg>
    <svg class="dd d6"><use href="#i-flower"/></svg>
    <p class="cover-kicker">幼儿园 · 秋天的小日子</p>
    <h1 class="cover-title"><span data-cfg="childName">小宝贝</span><br>的成长手账</h1>
    <div class="cover-polas">
      <figure class="pola mini" style="--r:-8deg"><img src="photos/p03.jpg" alt=""></figure>
      <figure class="pola mini" style="--r:5deg"><img src="photos/p15.jpg" alt=""></figure>
      <figure class="pola mini" style="--r:-3deg"><img src="photos/p12.jpg" alt=""></figure>
    </div>
    <p class="cover-sub"><span data-cfg="term">2025 秋季学期</span> · <span data-cfg="className">待填 · 班级</span></p>

  </div>
</header>

<nav class="chapnav" id="chapnav" aria-label="章节导航"></nav>

</section>

<footer class="foot">

  <p>写给 <span data-cfg="childName">小宝贝</span>：慢慢长大，每一天都闪闪发光。</p>
  <p class="foot-sign">—— 爱你的 <span data-cfg="signature">爸爸妈妈</span></p>
  <a href="#top" class="totop">回到封面 ↑</a>
</footer>
